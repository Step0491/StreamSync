name: Generate Signing Keystore (Run Once)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore and Base64
        run: |
          keytool -genkeypair -v \
            -keystore streamsync.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias streamsync \
            -storepass streamsync \
            -keypass streamsync \
            -dname "CN=StreamSync, O=StreamSync, C=IT"
          base64 -w 0 streamsync.jks > keystore-base64.txt

      - name: Upload keystore-base64.txt
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore-base64
          path: keystore-base64.txt
          retention-days: 1
