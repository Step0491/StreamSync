name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode Persistent Signing Keystore (if configured)
        if: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "${{ runner.temp }}/streamsync.jks"
          echo "STREAMSYNC_KEYSTORE_PATH=${{ runner.temp }}/streamsync.jks" >> $GITHUB_ENV

      - name: Build Debug APK
        working-directory: android
        env:
          STREAMSYNC_BUILD_NUMBER: ${{ github.run_number }}
          STREAMSYNC_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS || 'streamsync' }}
          STREAMSYNC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'streamsync' }}
          STREAMSYNC_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS || 'streamsync' }}
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamsync-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Publish GitHub Release for In-App Updater
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: StreamSync Android v0.1.${{ github.run_number }} (build ${{ github.run_number }})
          body: Deterministic Android build #${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
