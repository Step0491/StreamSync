<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamSync Desktop</title>
  <link rel="icon" type="image/png" href="../assets/icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="chrome-bar">
    <div class="tab-group">
      <button id="btn-tab-room" class="nav-tile active" type="button" title="Room">
        <img class="tile-icon" src="../assets/icons/ic_tab_room.png" alt="" />
        <span class="tile-label">Room</span>
      </button>
      <button id="btn-tab-browser" class="nav-tile" type="button" title="Browser">
        <img class="tile-icon" src="../assets/icons/ic_tab_browser.png" alt="" />
        <span class="tile-label">Browser</span>
      </button>
    </div>

    <div class="nav-group">
      <button id="btn-back" class="icon-btn" type="button" title="Back">&#8592;</button>
      <button id="btn-forward" class="icon-btn" type="button" title="Forward">&#8594;</button>
      <button id="btn-reload" class="icon-btn" type="button" title="Reload">&#8635;</button>
    </div>

    <button id="btn-shield" class="shield-btn hidden" type="button" title="Toggle uBlock Ad &amp; Popup Shield for this site">
      Shield: ON
    </button>

    <form id="url-form" class="url-box">
      <input id="url-input" type="text" placeholder="https://streamsync-pj98.onrender.com/" spellcheck="false" />
      <button type="submit" class="go-btn">Go</button>
    </form>

    <button id="btn-streams" class="nav-tile streams-btn" type="button" title="Detected Streams">
      <img class="tile-icon" src="../assets/icons/ic_tab_stream.png" alt="" />
      <span id="label-streams" class="tile-label">Streams (0)</span>
    </button>
    <button id="btn-update" class="nav-tile" type="button" title="Check for Updates">
      <img class="tile-icon" src="../assets/icons/ic_tab_update.png" alt="" />
      <span id="label-update" class="tile-label">Update</span>
    </button>
  </header>

  <div id="update-bar" class="update-bar hidden">
    <span id="update-bar-text" class="update-bar-text">Downloading update... 0%</span>
    <div class="update-track">
      <div id="update-fill" class="update-fill"></div>
    </div>
  </div>

  <aside id="streams-drawer" class="drawer hidden">
    <div class="drawer-header">
      <div>
        <h2 id="drawer-title">Detected Streams (0)</h2>
        <span class="drawer-sub">uBlock-filtered • HLS / DASH / MP4 / XHR</span>
      </div>
      <div class="drawer-header-actions">
        <button id="btn-extract-page" class="btn-sm btn-primary" type="button" title="Run backend yt-dlp extraction on current Browser URL">Extract Page</button>
        <button id="btn-clear-streams" class="btn-sm btn-secondary" type="button">Clear</button>
        <button id="btn-close-drawer" class="btn-sm btn-secondary" type="button">Close</button>
      </div>
    </div>

    <div id="pair-hint" class="pair-hint hidden"></div>

    <div class="drawer-tabs">
      <button class="dtab active" data-tab="combined" type="button">Combined (<span id="cnt-combined">0</span>)</button>
      <button class="dtab" data-tab="pair" type="button">Pair V + A</button>
      <button class="dtab" data-tab="video" type="button">Video-Only (<span id="cnt-video">0</span>)</button>
      <button class="dtab" data-tab="audio" type="button">Audio-Only (<span id="cnt-audio">0</span>)</button>
      <button class="dtab" data-tab="manual" type="button">Manual URLs</button>
    </div>

    <div id="drawer-content" class="drawer-content"></div>
  </aside>

  <script src="renderer.js"></script>
</body>
</html>
